# Application and local defaults.
spring.application.name=BlinkChat
spring.profiles.default=dev
server.port=${PORT:8080}

# Durable local storage; override the directory and password through the environment.
spring.datasource.url=jdbc:h2:file:${BLINK_DATA_DIR:./data}/blinkchat;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${BLINK_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Keep internal failures out of responses and protect the guest session cookie.
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# The WebSocket origin must match the public address used by the browser.
blink.origin=${BLINK_ORIGIN:http://localhost:8080}
blink.secure-cookie=${BLINK_SECURE_COOKIE:false}

# Logging and request size limits.
logging.level.org.springframework.web.socket=WARN
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
spring.servlet.multipart.max-request-size=16KB
server.tomcat.max-http-form-post-size=16KB
