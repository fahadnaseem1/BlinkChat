# HTTPS deployment behind Render or another trusted reverse proxy.
# Render injects its actual URL. A custom domain can override it with BLINK_ORIGIN.
blink.origin=${BLINK_ORIGIN:${RENDER_EXTERNAL_URL}}
blink.secure-cookie=true
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
server.address=0.0.0.0

# Hosted deployments require a stable secret; never silently create an unprotected DB.
spring.datasource.password=${BLINK_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Keep native/thread memory available on the smallest disk-compatible compute plan.
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=2
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
